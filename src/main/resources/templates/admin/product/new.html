<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main class="max-w-7xl mx-auto px-4 py-16">

  <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-12 gap-6">
    <div>
      <a th:href="@{/admin/product}" class="text-[10px] font-black uppercase text-indigo-600 tracking-[0.2em] hover:text-gray-900 transition">
        &larr; Powrót do Magazynu
      </a>
      <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tighter mt-2">Inicjalizacja Modułu</h1>
      <p class="text-gray-400 font-bold uppercase text-[10px] tracking-[0.3em] mt-1">
        Wprowadzanie nowego podzespołu do bazy danych
      </p>
    </div>

    <div class="flex items-center gap-3 bg-indigo-50 px-6 py-3 rounded-2xl border border-indigo-100">
      <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
      <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Oczekiwanie na dane wejściowe</span>
    </div>
  </div>

  <form th:action="@{/admin/product/new}" th:object="${product}" method="post" enctype="multipart/form-data">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">

      <div class="lg:col-span-2 space-y-8">
        <div class="bg-white rounded-[3rem] p-10 shadow-sm border border-gray-100 space-y-8">

          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Nazwa Produktu / Modelu</label>
            <input type="text" th:field="*{name}" placeholder="np. Moduł Sterowania ESP32-WROOM"
                   class="w-full bg-gray-50 border-transparent rounded-[1.5rem] p-5 text-gray-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all border-2 focus:border-indigo-100" required>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Cena Netto (PLN)</label>
              <input type="number" step="0.01" th:field="*{price}" placeholder="0.00"
                     class="w-full bg-gray-50 border-transparent rounded-[1.5rem] p-5 text-gray-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all border-2 focus:border-indigo-100" required>
            </div>
            <div>
              <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Ilość w Dostawie (Szt.)</label>
              <input type="number" th:field="*{stockQuantity}" placeholder="0"
                     class="w-full bg-gray-50 border-transparent rounded-[1.5rem] p-5 text-gray-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all border-2 focus:border-indigo-100" required>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Segment / Kategoria</label>
            <select th:field="*{category}" class="w-full bg-gray-50 border-transparent rounded-[1.5rem] p-5 text-gray-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all border-2 focus:border-indigo-100 appearance-none">
              <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Wybierz kategorię...</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">Pełna Specyfikacja / Opis</label>
            <textarea th:field="*{description}" rows="6" placeholder="Wpisz parametry techniczne..."
                      class="w-full bg-gray-50 border-transparent rounded-[2rem] p-6 text-gray-900 font-medium focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all border-2 focus:border-indigo-100"></textarea>
          </div>
        </div>
      </div>

      <div class="lg:col-span-1 space-y-8">
        <div class="bg-white rounded-[3rem] p-10 shadow-sm border border-gray-100">
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-6 ml-2">Przechwytywanie Obrazu</label>

          <div class="space-y-4">
            <div class="relative group cursor-pointer">
              <input type="file" name="files" multiple accept="image/*" onchange="previewMultipleImages(event)"
                     class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <div class="bg-gray-50 border-2 border-dashed border-gray-200 rounded-[2rem] p-8 text-center group-hover:border-indigo-500 group-hover:bg-indigo-50/30 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-300 mx-auto mb-4 group-hover:text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Wybierz lub upuść zdjęcia</p>
              </div>
            </div>

            <div id="new-images-preview" class="grid grid-cols-3 gap-2 mt-4">
            </div>
          </div>

          <p class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.2em] mt-6 leading-relaxed">
            * Pierwsze przesłane zdjęcie zostanie ustawione jako domyślny sygnał wizualny.
          </p>
        </div>

        <div class="flex flex-col gap-4">
          <button type="submit" class="w-full bg-gray-900 hover:bg-green-600 text-white font-black uppercase text-[12px] tracking-[0.2em] py-6 rounded-[2rem] shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Zainstaluj Produkt
          </button>

          <a th:href="@{/admin/product}"
             class="w-full bg-gray-100 hover:bg-gray-200 text-gray-500 font-black uppercase text-[11px] tracking-widest py-5 rounded-[1.5rem] transition-all text-center">
            Porzuć Inicjalizację
          </a>
        </div>
      </div>
    </div>
  </form>

  <script>
    function previewMultipleImages(event) {
      const previewContainer = document.getElementById('new-images-preview');
      previewContainer.innerHTML = '';
      const files = event.target.files;
      for (let i = 0; i < files.length; i++) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const div = document.createElement('div');
          div.className = "relative aspect-square rounded-xl overflow-hidden shadow-sm border border-indigo-100";
          div.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(files[i]);
      }
    }
  </script>
</main>
</body>
</html>

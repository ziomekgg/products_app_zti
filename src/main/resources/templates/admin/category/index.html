<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main class="max-w-7xl mx-auto px-4 py-16">

  <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-12 gap-6">
    <div>
      <a th:href="@{/admin/product}" class="text-[10px] font-black uppercase text-indigo-600 tracking-[0.2em] hover:text-gray-900 transition">
        &larr; Powrót do Magazynu
      </a>
      <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tighter mt-2">Struktura Kategorii</h1>
      <p class="text-gray-400 font-bold uppercase text-[10px] tracking-[0.3em] mt-1">Zarządzaj segmentami podzespołów</p>
    </div>

    <a th:href="@{/admin/category/new}"
       class="bg-gray-900 hover:bg-indigo-600 text-white font-black uppercase text-[11px] tracking-widest py-4 px-8 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
      Dodaj Nowy Segment
    </a>
  </div>

  <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-gray-50/50 border-b border-gray-100">
      <tr>
        <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-[0.2em]">Sygnał ID</th>
        <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-[0.2em]">Nazwa Segmentu</th>
        <th class="px-8 py-5 text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] text-right">Operacje</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-gray-50">
      <tr th:each="cat : ${categories}" class="hover:bg-indigo-50/30 transition-colors group">
        <td class="px-8 py-6">
          <span class="font-mono text-sm text-gray-400 bg-gray-100 px-3 py-1 rounded-lg" th:text="${'#CAT-' + cat.id}">#CAT-1</span>
        </td>
        <td class="px-8 py-6">
          <span class="text-lg font-black text-gray-900 uppercase tracking-tight" th:text="${cat.name}">Nazwa</span>
        </td>
        <td class="px-8 py-6 text-right">
          <div class="flex justify-end items-center gap-4">
            <a th:href="@{/admin/category/{id}/edit(id=${cat.id})}"
               class="text-gray-400 hover:text-indigo-600 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </a>

            <form th:id="'delete-form-' + ${cat.id}" th:action="@{/admin/category/{id}(id=${cat.id})}" method="post" class="inline">
              <button type="button"
                      th:onclick="'openDeleteModal(' + ${cat.id} + ')'"
                      class="text-gray-300 hover:text-red-500 transition-colors p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>

    <div th:if="${#lists.isEmpty(categories)}" class="text-center py-20">
      <div class="inline-block p-6 bg-gray-50 rounded-full mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
      </div>
      <p class="text-gray-400 font-bold uppercase tracking-widest text-xs">Baza kategorii jest pusta</p>
    </div>
  </div>

  <div id="delete-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
    <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"></div>

    <div class="relative bg-white rounded-[3rem] p-10 max-w-md w-full mx-4 shadow-2xl border border-gray-100 transition-all scale-95 opacity-0" id="modal-box">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-red-50 rounded-full mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>

        <h2 class="text-2xl font-black text-gray-900 uppercase tracking-tighter mb-2">Potwierdź demontaż</h2>
        <p class="text-gray-500 font-bold uppercase text-[10px] tracking-[0.2em] mb-8">Czy na pewno chcesz usunąć ten segment? Operacja jest nieodwracalna.</p>

        <div class="flex gap-4">
          <button onclick="closeDeleteModal()"
                  class="flex-1 px-6 py-4 bg-gray-100 text-gray-400 font-black uppercase text-[11px] tracking-widest rounded-2xl hover:bg-gray-200 transition-all">
            Anuluj
          </button>
          <button id="confirm-delete-btn"
                  class="flex-1 px-6 py-4 bg-red-500 text-white font-black uppercase text-[11px] tracking-widest rounded-2xl hover:bg-red-600 shadow-lg shadow-red-200 transition-all active:scale-95">
            Usuń trwale
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let formToSubmit = null;

    function openDeleteModal(categoryId) {
      formToSubmit = document.getElementById('delete-form-' + categoryId);
      const modal = document.getElementById('delete-modal');
      const box = document.getElementById('modal-box');

      modal.classList.remove('hidden');
      setTimeout(() => {
        box.classList.remove('scale-95', 'opacity-0');
        box.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeDeleteModal() {
      const modal = document.getElementById('delete-modal');
      const box = document.getElementById('modal-box');

      box.classList.remove('scale-100', 'opacity-100');
      box.classList.add('scale-95', 'opacity-0');

      setTimeout(() => {
        modal.classList.add('hidden');
        formToSubmit = null;
      }, 200);
    }

    document.getElementById('confirm-delete-btn').addEventListener('click', function() {
      if (formToSubmit) {
        formToSubmit.submit();
      }
    });

    document.getElementById('delete-modal').addEventListener('click', function(e) {
      if (e.target === this) closeDeleteModal();
    });
  </script>

</main>
</body>
</html>

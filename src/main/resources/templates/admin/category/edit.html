<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main class="max-w-7xl mx-auto px-4 py-16 flex justify-center">

  <div class="max-w-xl w-full">
    <div class="mb-10 text-center">
      <a th:href="@{/admin/category}" class="text-[10px] font-black uppercase text-indigo-600 tracking-[0.2em] hover:text-gray-900 transition">
        &larr; Anuluj i wróć do listy
      </a>
      <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tighter mt-4">
        Konfiguracja Segmentu
      </h1>
      <p class="text-gray-400 font-bold uppercase text-[10px] tracking-[0.3em] mt-1">
        Zmieniasz parametry dla: <span th:text="${category.name}" class="text-indigo-600">Nazwa</span>
      </p>
    </div>

    <div class="bg-white rounded-[3rem] p-12 shadow-sm border border-gray-100 relative overflow-hidden">
      <div class="absolute top-0 right-0 p-8 opacity-5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-gray-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
      </div>
      <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border border-red-100 rounded-2xl flex items-center gap-3 animate-pulse">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        <span class="text-[11px] font-black uppercase text-red-500 tracking-widest" th:text="${errorMessage}"></span>
      </div>
      <form th:action="@{/admin/category/{id}/edit(id=${category.id})}" method="post" class="space-y-8 relative z-10">
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-2">
            Nowa nazwa modułu / segmentu
          </label>
          <input type="text"
                 name="name"
                 th:value="${category.name}"
                 placeholder="Wpisz nazwę..."
                 class="w-full bg-gray-50 border-transparent rounded-[1.5rem] p-5 text-gray-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all border-2 focus:border-indigo-100"
                 required>
        </div>

        <div class="flex flex-col gap-4 pt-4">
          <button type="submit"
                  class="w-full bg-gray-900 hover:bg-indigo-600 text-white font-black uppercase text-[11px] tracking-widest py-5 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            Zapisz nową konfigurację
          </button>

          <a th:href="@{/admin/category}"
             class="w-full text-center py-4 text-gray-400 font-black uppercase text-[10px] tracking-widest hover:text-gray-900 transition">
            Porzuć zmiany
          </a>
        </div>
      </form>
    </div>

    <div class="mt-8 flex justify-center">
      <div class="px-4 py-2 bg-gray-100 rounded-full flex items-center gap-2">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">System Ready: ID-#<span th:text="${category.id}"></span></span>
      </div>
    </div>
  </div>

</main>
</body>
</html>

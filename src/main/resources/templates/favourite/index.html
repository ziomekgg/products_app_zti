<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main class="max-w-7xl mx-auto px-4 py-16">
  <h1 class="text-3xl font-black uppercase tracking-tighter mb-8">Twoje Zapisane Moduły</h1>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
    <div th:each="fav : ${favourites}" class="group bg-white rounded-[2.5rem] p-5 border border-gray-100 shadow-sm hover:shadow-2xl transition-all relative">

      <a th:href="@{/product/{id}(id=${fav.product.id})}" class="block">
        <div class="overflow-hidden rounded-[2rem] mb-6">
          <img th:src="@{'/uploads/' + ${fav.product.imageUrl}}"
               class="w-full h-48 object-cover group-hover:scale-110 transition duration-500"
               alt="Brak zdjęcia">
        </div>
        <h3 class="text-lg font-black text-gray-900 uppercase tracking-tight group-hover:text-indigo-600 transition"
            th:text="${fav.product.name}">Produkt</h3>
      </a>

      <div class="flex justify-between items-center mt-4">
        <p class="text-indigo-600 font-black text-xl" th:text="${fav.product.price} + ' PLN'"></p>

        <div class="flex space-x-2">
          <form th:action="@{/reservation/make/{id}(id=${fav.product.id})}" method="post">
            <input type="hidden" name="quantity" value="1">

            <button type="submit" title="Dodaj do rezerwacji"
                    class="bg-gray-900 text-white p-3 rounded-xl hover:bg-indigo-600 transition shadow-lg active:scale-95 group">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
            </button>
          </form>

          <form th:action="@{/favourite/toggle/{id}(id=${fav.product.id})}" method="post">
            <button type="submit" class="bg-red-50 text-red-500 p-3 rounded-xl hover:bg-red-500 hover:text-white transition shadow-sm active:scale-95">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001z" />
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>

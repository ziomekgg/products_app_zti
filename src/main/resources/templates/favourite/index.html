<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main class="max-w-7xl mx-auto px-4 py-16">
  <h1 class="text-3xl font-black uppercase tracking-tighter mb-8">Twoje Zapisane Moduły</h1>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <div th:each="fav : ${favourites}" class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100 relative">
      <img th:src="@{'/uploads/' + ${fav.product.imageUrl}}"
           class="w-full h-40 object-cover rounded-2xl mb-4"
           alt="Brak zdjęcia produktu">
      <h3 class="font-bold text-gray-900" th:text="${fav.product.name}">Produkt</h3>
      <p class="text-indigo-600 font-black mt-2" th:text="${fav.product.price} + ' PLN'"></p>

      <form th:action="@{/favourite/toggle/{id}(id=${fav.product.id})}" method="post">
        <button type="submit" class="absolute top-6 right-6 text-red-500 hover:scale-110 transition">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001z" /></svg>
        </button>
      </form>
    </div>
  </div>
</main>
</body>
</html>

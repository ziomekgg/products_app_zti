<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main class="max-w-7xl mx-auto px-4 py-16">
  <div class="mb-12">
    <a th:href="@{/category}" class="text-[10px] font-black uppercase text-indigo-600 tracking-[0.2em] hover:text-gray-900 transition">
      &larr; Powrót do segmentów
    </a>
    <h1 class="text-5xl font-black text-gray-900 uppercase tracking-tighter mt-4" th:text="${category.name}">
      Nazwa Kategorii
    </h1>
    <div class="h-1 w-20 bg-indigo-600 mt-4 rounded-full"></div>
  </div>

  <div th:if="${products.isEmpty()}" class="bg-white rounded-[3rem] p-20 text-center border-2 border-dashed border-gray-100">
    <p class="text-gray-400 font-bold uppercase tracking-widest">Brak dostępnych modułów w tej sekcji</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
    <div th:each="product : ${products}" class="group bg-white rounded-[2.5rem] p-5 border border-gray-100 shadow-sm hover:shadow-2xl transition-all relative">

      <form th:action="@{/favourite/toggle/{id}(id=${product.id})}" method="post" class="absolute top-6 right-6 z-10">
        <button type="submit" class="p-3 rounded-2xl backdrop-blur-md transition active:scale-90 shadow-sm"
                th:classappend="${favouriteProductIds != null && favouriteProductIds.contains(product.id)} ? 'bg-red-500 text-white' : 'bg-white/90 text-gray-300 hover:text-red-500'">
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001z" />
          </svg>
        </button>
      </form>

      <div class="overflow-hidden rounded-[2rem] mb-6">
        <img th:src="@{'/uploads/' + ${product.imageUrl}}" class="w-full h-48 object-cover group-hover:scale-110 transition duration-500">
      </div>

      <h3 class="text-lg font-black text-gray-900 uppercase tracking-tight" th:text="${product.name}">Nazwa</h3>
      <div class="flex justify-between items-center mt-4">
        <span class="text-indigo-600 font-black text-xl" th:text="${product.price} + ' PLN'">0.00</span>
        <a th:href="@{/product/{id}(id=${product.id})}" class="bg-gray-900 text-white p-3 rounded-xl hover:bg-indigo-600 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</main>
</body>
</html>

<th:block th:fragment="product-list">
  <div th:each="product : ${products}"
       class="product-card group bg-white rounded-[4rem] p-8 border border-gray-100 shadow-sm hover:shadow-2xl hover:-translate-y-3 transition-all duration-500 flex flex-col">

    <div class="relative aspect-square bg-gray-50 rounded-[3rem] overflow-hidden mb-10 shadow-inner">
      <a th:href="@{/product/{id}(id=${product.id})}">
        <img th:src="@{${product.imageUrl != null ? '/uploads/' + product.imageUrl : 'https://via.placeholder.com/600x600?text=Brak+Zdjecia'}}"
             class="w-full h-full object-contain p-12 group-hover:scale-110 transition duration-700"
             loading="lazy"
             alt="Produkt">
      </a>
    </div>

    <div class="px-4 flex-grow">
      <div class="flex justify-between items-center mb-4">
        <p class="text-[12px] font-extrabold text-indigo-500 uppercase tracking-widest"
           th:text="${product.category != null ? product.category.name : 'Podzespół'}"></p>
        <span class="text-2xl font-black text-gray-900" th:text="${product.price} + ' PLN'"></span>
      </div>
      <h3 class="font-bold text-gray-900 text-3xl mb-4 line-clamp-2" th:text="${product.name}"></h3>
      <p class="text-gray-400 text-base mb-10 line-clamp-4 leading-relaxed" th:text="${product.description}"></p>
    </div>

    <div class="px-2 pb-2 mt-auto">
      <a th:href="@{/product/{id}(id=${product.id})}"
         class="block w-full text-center bg-gray-900 text-white font-black py-6 rounded-[2rem] hover:bg-indigo-600 transition-all shadow-xl uppercase text-[12px] tracking-widest">
        Szczegóły
      </a>
    </div>
  </div>
</th:block>

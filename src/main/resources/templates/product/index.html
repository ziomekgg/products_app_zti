<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::main})}">
<body>
<main>
  <div class="max-w-7xl mx-auto px-4">

    <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-12">
      <div th:replace="~{product/fragments :: product-list}"></div>
    </div>

    <div id="infinite-scroll-sentinel" class="h-20 w-full flex justify-center items-center mt-10">
      <div class="loader animate-spin h-8 w-8 border-4 border-indigo-500 border-t-transparent rounded-full opacity-0 transition-opacity" id="loader"></div>
    </div>

    <script>
      let currentPage = 1;
      const sentinel = document.querySelector('#infinite-scroll-sentinel');
      const container = document.querySelector('#grid-container');
      const loader = document.querySelector('#loader');
      let isFetching = false;
      let hasMore = true;

      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isFetching && hasMore) {
          loadMoreProducts();
        }
      }, { rootMargin: '400px' }); // Zwiększamy margines dla płynności

      observer.observe(sentinel);

      async function loadMoreProducts() {
        isFetching = true;
        loader.classList.remove('opacity-0');

        try {
          const response = await fetch(`/api/products/fragment?page=${currentPage}`);
          const html = await response.text();

          // POPRAWIONY WARUNEK STOPU
          // Sprawdzamy czy w zwróconym HTML jest klasa 'product-card'
          if (html.trim() === "" || !html.includes("product-card")) {
            hasMore = false;
            observer.unobserve(sentinel);
            loader.remove();
            return;
          }

          container.insertAdjacentHTML('beforeend', html);
          currentPage++;
        } catch (error) {
          console.error("Błąd Modułu Mocy:", error);
        } finally {
          isFetching = false;
          loader.classList.add('opacity-0');
        }
      }
    </script>
  </div>
</main>
</body>
</html>

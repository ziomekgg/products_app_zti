<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Store | Witaj</title>
    <!-- Tailwind CSS do stylizacji -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<!-- Uproszczony Header tylko dla strony Home -->
<nav class="bg-white border-b border-gray-100 p-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-2xl font-black text-indigo-600 tracking-tighter uppercase">
                HARDWARE<span class="text-gray-900">STORE</span>
            </span>
        <a th:href="@{/product}" class="text-sm font-bold uppercase tracking-widest text-gray-500 hover:text-indigo-600 transition">
            Wejdź do sklepu →
        </a>
    </div>
</nav>

<!-- Główna treść -->
<main class="flex-grow max-w-7xl mx-auto px-4 py-16 w-full flex flex-col lg:flex-row gap-12 items-center">

    <aside class="w-full lg:w-1/3 space-y-6 self-start">
        <div class="mb-8">
            <h2 class="text-[10px] font-black uppercase text-indigo-600 tracking-[0.3em]">Feed z terminala</h2>
            <h3 class="text-2xl font-black text-gray-900 uppercase tracking-tighter">Głosy Operatorów</h3>
        </div>

        <div id="reviews-container" class="space-y-4">
            <div class="animate-pulse flex flex-col gap-4">
                <div class="h-32 bg-gray-100 rounded-[2rem]"></div>
                <div class="h-32 bg-gray-100 rounded-[2rem]"></div>
            </div>
        </div>
    </aside>

    <section class="w-full lg:w-2/3 text-center lg:text-left">
        <div class="space-y-6">
            <h1 class="text-6xl md:text-8xl font-black text-gray-900 tracking-tighter uppercase leading-none">
                Hardware <br> <span class="text-indigo-600">Store</span>
            </h1>
            <p class="text-xl text-gray-500 font-medium max-w-2xl lg:mx-0 mx-auto">
                Twoje centrum dowodzenia elektroniką. Najwyższa moc i czysta wydajność w jednym miejscu.
            </p>
            <div class="pt-10">
                <a th:href="@{/product}" class="inline-block bg-gray-900 text-white px-12 py-5 rounded-2xl font-bold uppercase tracking-widest hover:bg-indigo-600 transition-all shadow-2xl active:scale-95">
                    Rozpocznij zakupy
                </a>
            </div>
        </div>
    </section>
</main>

<!-- Stopka zgodna z Twoim życzeniem (taka jak w layout) -->
<footer class="bg-gray-900 text-gray-500 py-12">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
        <span class="text-white font-black uppercase tracking-tighter">Hardware Store</span>
        <span class="text-[10px] uppercase font-bold tracking-widest text-gray-600">2026 &copy; System Zarządzania</span>
    </div>
</footer>
<script>
    async function fetchReviews() {
        const container = document.getElementById('reviews-container');

        try {
            // Sygnał wysłany do zewnętrznego modułu
            const response = await fetch('https://dummyjson.com/comments?limit=3');
            if (!response.ok) throw new Error("Błąd połączenia");

            const data = await response.json();

            // KLUCZ: mapujemy po data.comments
            container.innerHTML = data.comments.map(review => `
                <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm hover:shadow-md transition-all group">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
                        <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">
                            Operator: ${review.user.username}
                        </span>
                    </div>
                    <p class="text-gray-600 text-sm font-medium italic leading-relaxed">
                        "${review.body}"
                    </p>
                    <div class="mt-4 flex gap-1 text-indigo-600">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    </div>
                </div>
            `).join('');

        } catch (error) {
            console.error('Błąd synchronizacji:', error);
            container.innerHTML = `
                <div class="p-8 bg-red-50 rounded-[2.5rem] border border-red-100 text-center">
                    <div class="text-red-500 font-black uppercase text-[10px] tracking-[0.3em]">Critical Error</div>
                    <p class="text-red-400 text-xs mt-2 font-bold">Brak połączenia z bazą recenzji</p>
                </div>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', fetchReviews);
</script>
</body>
</html>
